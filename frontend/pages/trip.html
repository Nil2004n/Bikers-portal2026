<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trip Planner — Bikers Portal</title>
</head>
<body>
  <div id="page-content">
    <div class="page-header">
      <div>
        <h1 class="page-header__title">Trip Planner</h1>
        <p class="page-header__subtitle">Plan, ride and log your adventures</p>
      </div>
      <div class="page-header__actions">
        <button type="button" id="open-plan-trip" class="btn btn--primary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Plan New Trip
        </button>
      </div>
    </div>

    <div class="trip-filters" id="trip-filters"></div>

    <div class="trip-layout">
      <div class="trip-layout__list" id="trips-list" aria-live="polite" aria-busy="true"></div>

      <aside class="trip-layout__detail" id="trip-detail" aria-label="Trip detail"></aside>
    </div>

    <!-- PLAN TRIP MODAL -->
    <div class="modal-backdrop" id="plan-trip-modal" role="dialog" aria-modal="true" aria-labelledby="plan-trip-title" aria-hidden="true">
      <div class="modal">
        <div class="modal__header">
          <h2 class="modal__title" id="plan-trip-title">Plan a new trip</h2>
          <button type="button" class="icon-btn" data-modal-close aria-label="Close">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="modal__body">
          <form id="plan-trip-form" class="form" novalidate>
            <div id="plan-trip-alert" aria-live="polite"></div>

            <div class="form__group">
              <label class="form__label form__label--required" for="trip-name">Trip name</label>
              <input type="text" id="trip-name" name="name" class="form__input" required maxlength="80" placeholder="Sunday Morning Loop">
            </div>

            <div class="form__row">
              <div class="form__group">
                <label class="form__label form__label--required" for="trip-start">Start location</label>
                <input type="text" id="trip-start" name="startLocation" class="form__input" required placeholder="Cubbon Park, Bengaluru">
              </div>
              <div class="form__group">
                <label class="form__label form__label--required" for="trip-end">End location</label>
                <input type="text" id="trip-end" name="endLocation" class="form__input" required placeholder="Nandi Hills">
              </div>
            </div>

            <div class="form__row">
              <div class="form__group">
                <label class="form__label form__label--required" for="trip-date">Planned date</label>
                <input type="date" id="trip-date" name="plannedDate" class="form__input" required>
              </div>
              <div class="form__group">
                <label class="form__label" for="trip-distance">Distance (km)</label>
                <input type="number" id="trip-distance" name="distance" class="form__input" min="0" step="0.1" placeholder="60">
              </div>
            </div>

            <div class="form__group">
              <label class="form__label" for="trip-notes">Notes</label>
              <textarea id="trip-notes" name="notes" class="form__textarea" maxlength="500" rows="3" placeholder="Group size, gear, water stops..."></textarea>
            </div>
          </form>
        </div>

        <div class="modal__footer">
          <button type="button" class="btn btn--secondary" data-modal-close>Cancel</button>
          <button type="button" id="plan-trip-save" class="btn btn--primary">Save Trip</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
