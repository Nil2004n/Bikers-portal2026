<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile — Bikers Portal</title>
</head>
<body>
  <div id="page-content">
    <div class="page-header">
      <div>
        <h1 class="page-header__title">Your profile</h1>
        <p class="page-header__subtitle">Manage your rides, rentals and posts</p>
      </div>
      <div class="page-header__actions">
        <button type="button" class="btn btn--secondary btn--sm" onclick="window.location.hash='#bikes'">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6l-3 7 4 4M5.5 17.5L9 9h3.5"/></svg>
          Find a bike
        </button>
      </div>
    </div>

    <!-- PROFILE HERO -->
    <section id="profile-hero" class="profile-hero" aria-busy="true"></section>

    <!-- TABS -->
    <div class="profile-tabs-wrap">
      <div class="tabs" id="profile-tabs" role="tablist" aria-label="Profile sections">
        <button class="tab" role="tab" data-profile-tab="overview" aria-selected="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Overview
        </button>
        <button class="tab" role="tab" data-profile-tab="edit" aria-selected="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4z"/></svg>
          Edit Profile
        </button>
        <button class="tab" role="tab" data-profile-tab="rentals" aria-selected="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Rental History
        </button>
        <button class="tab" role="tab" data-profile-tab="posts" aria-selected="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
          My Posts
        </button>
      </div>

      <!-- OVERVIEW -->
      <section class="profile-tab-panel" id="tab-overview" role="tabpanel" aria-labelledby="profile-tabs"></section>

      <!-- EDIT PROFILE -->
      <section class="profile-tab-panel" id="tab-edit" role="tabpanel" aria-labelledby="profile-tabs" hidden>
        <form id="edit-profile-form" class="form" novalidate>
          <div id="edit-profile-alert" aria-live="polite"></div>

          <div class="form__row">
            <div class="form__group">
              <label class="form__label form__label--required" for="ep-name">Full name</label>
              <input type="text" name="name" id="ep-name" class="form__input" required minlength="2" maxlength="80">
            </div>
            <div class="form__group">
              <label class="form__label" for="ep-username">Username</label>
              <input type="text" name="username" id="ep-username" class="form__input" maxlength="30" autocomplete="username">
            </div>
          </div>

          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="ep-email">Email</label>
              <input type="email" name="email" id="ep-email" class="form__input" disabled>
              <span class="form__hint">Email cannot be changed</span>
            </div>
            <div class="form__group">
              <label class="form__label" for="ep-location">Location</label>
              <input type="text" name="location" id="ep-location" class="form__input" placeholder="City, Country" maxlength="80">
            </div>
          </div>

          <div class="form__group">
            <label class="form__label" for="ep-bio">Bio</label>
            <textarea name="bio" id="ep-bio" class="form__textarea" maxlength="500" rows="3" placeholder="Tell other riders about yourself..."></textarea>
          </div>

          <div class="form__group">
            <label class="form__label" for="ep-types">Preferred bike types (comma separated)</label>
            <input type="text" name="preferredTypes" id="ep-types" class="form__input" placeholder="Road, MTB, Touring">
            <span class="form__hint">Helps AI tailor your recommendations</span>
          </div>

          <div class="form__group">
            <label class="form__label">Avatar color</label>
            <div id="avatar-color-picker" class="color-picker"></div>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:var(--space-2); padding-top:var(--space-3); border-top:1px solid var(--color-divider);">
            <button type="button" class="btn btn--secondary" data-action="reset-edit">Reset</button>
            <button type="submit" id="profile-save-btn" class="btn btn--primary">Save Changes</button>
          </div>
        </form>
      </section>

      <!-- RENTAL HISTORY -->
      <section class="profile-tab-panel" id="tab-rentals" role="tabpanel" aria-labelledby="profile-tabs" hidden>
        <div id="rental-history" aria-live="polite" aria-busy="true"></div>
      </section>

      <!-- MY POSTS -->
      <section class="profile-tab-panel" id="tab-posts" role="tabpanel" aria-labelledby="profile-tabs" hidden>
        <div id="my-posts" aria-live="polite" aria-busy="true" style="display:flex; flex-direction:column; gap:var(--space-4);"></div>
      </section>
    </div>
  </div>
</body>
</html>
