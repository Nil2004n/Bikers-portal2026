<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Picks — Bikers Portal</title>
</head>
<body>
  <div id="page-content">
    <div class="page-header">
      <div>
        <h1 class="page-header__title">AI Bike Recommendations</h1>
        <p class="page-header__subtitle">Tell us how you ride — we'll suggest the perfect bike</p>
      </div>
    </div>

    <div class="reco-page">
      <form id="reco-form" class="form reco-form card" novalidate>
        <div class="card__header">
          <h2 class="card__title">Your riding profile</h2>
        </div>

        <div class="form__group">
          <label class="form__label form__label--required">Riding style</label>
          <div id="reco-style" class="chip-group"></div>
        </div>

        <div class="form__row">
          <div class="form__group">
            <label class="form__label form__label--required" for="reco-budget-number">Budget (₹)</label>
            <div style="display:flex; gap:var(--space-2); align-items:center;">
              <input type="range" id="reco-budget-slider" class="range" aria-label="Budget slider">
              <input type="number" id="reco-budget-number" class="form__input" min="5000" max="200000" step="1000" style="max-width:120px;">
            </div>
            <div class="range-labels">
              <span>₹5,000</span>
              <span id="reco-budget-display" style="color:var(--color-primary); font-weight:600;">₹60,000</span>
              <span>₹2,00,000</span>
            </div>
          </div>

          <div class="form__group">
            <label class="form__label form__label--required" for="reco-experience">Experience level</label>
            <select id="reco-experience" class="form__select" required></select>
          </div>
        </div>

        <div class="form__group">
          <label class="form__label form__label--required">Terrain preference</label>
          <div id="reco-terrain" class="chip-group"></div>
        </div>

        <div class="form__row">
          <div class="form__group">
            <label class="form__label" for="reco-hours">Weekly riding hours</label>
            <input type="number" id="reco-hours" class="form__input" min="0" max="40" step="1" value="4">
          </div>
          <div class="form__group">
            <label class="form__label" for="reco-notes">Notes (optional)</label>
            <input type="text" id="reco-notes" class="form__input" placeholder="Back pain, height, ...">
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:var(--space-2); padding-top:var(--space-3); border-top:1px solid var(--color-divider);">
          <button type="submit" id="reco-submit-btn" class="btn btn--primary">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>
            Get Recommendations
          </button>
        </div>
      </form>

      <div id="reco-results" class="reco-results" aria-live="polite"></div>
    </div>
  </div>
</body>
</html>
