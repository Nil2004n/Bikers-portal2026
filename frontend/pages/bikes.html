<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bikes — Bikers Portal</title>
</head>
<body>
  <div id="page-content">
    <div class="page-header">
      <div>
        <h1 class="page-header__title">Find your next bike</h1>
        <p class="page-header__subtitle">Rent by the day or buy your forever ride</p>
      </div>
      <div class="page-header__actions">
        <button type="button" class="btn btn--secondary btn--sm" onclick="window.location.hash='#recommendation'">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>
          AI picks
        </button>
      </div>
    </div>

    <div class="bikes-layout">
      <!-- FILTERS -->
      <aside class="bikes-layout__filters" id="bikes-filters" aria-label="Filters">
        <div class="card">
          <div class="card__header">
            <h2 class="card__title">Search</h2>
          </div>
          <div class="form__group">
            <label class="form__label" for="bike-search">Keyword</label>
            <div style="position:relative;">
              <input type="search" id="bike-search" class="form__input" placeholder="Trek, MTB, road..." style="padding-left: 40px;">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--color-text-muted);">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card__header">
            <h2 class="card__title">Type</h2>
          </div>
          <div id="bikes-type-filters" class="chip-group">
            <button type="button" class="chip" data-type-filter="All" aria-pressed="true">All</button>
            <button type="button" class="chip" data-type-filter="Road" aria-pressed="false">Road</button>
            <button type="button" class="chip" data-type-filter="MTB" aria-pressed="false">MTB</button>
            <button type="button" class="chip" data-type-filter="Electric" aria-pressed="false">Electric</button>
            <button type="button" class="chip" data-type-filter="Hybrid" aria-pressed="false">Hybrid</button>
            <button type="button" class="chip" data-type-filter="Fixed Gear" aria-pressed="false">Fixed Gear</button>
          </div>
        </div>

        <div class="card">
          <div class="card__header">
            <h2 class="card__title">Mode</h2>
          </div>
          <div id="bikes-mode-filters" class="chip-group">
            <button type="button" class="chip" data-mode-filter="All" aria-pressed="true">All</button>
            <button type="button" class="chip" data-mode-filter="Rent" aria-pressed="false">Rent</button>
            <button type="button" class="chip" data-mode-filter="Buy" aria-pressed="false">Buy</button>
            <button type="button" class="chip" data-mode-filter="Both" aria-pressed="false">Both</button>
          </div>
        </div>

        <div class="card">
          <div class="card__header">
            <h2 class="card__title">Price (₹/day)</h2>
          </div>
          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="bike-min-price">Min</label>
              <input type="number" min="0" id="bike-min-price" class="form__input" placeholder="0">
            </div>
            <div class="form__group">
              <label class="form__label" for="bike-max-price">Max</label>
              <input type="number" min="0" id="bike-max-price" class="form__input" placeholder="5000">
            </div>
          </div>
          <div style="display:flex; gap:var(--space-2); margin-top:var(--space-3);">
            <button type="button" id="bikes-apply-filters" class="btn btn--primary btn--sm btn--block">Apply Filters</button>
            <button type="button" id="bikes-reset-filters" class="btn btn--ghost btn--sm">Reset</button>
          </div>
        </div>
      </aside>

      <!-- MAIN GRID -->
      <div class="bikes-layout__main">
        <div class="bikes-toolbar">
          <div class="bikes-toolbar__count" id="bikes-count">Loading bikes...</div>
          <div class="bikes-toolbar__view" role="group" aria-label="View toggle">
            <button type="button" data-bikes-view="grid" aria-pressed="true" aria-label="Grid view">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </button>
            <button type="button" data-bikes-view="list" aria-pressed="false" aria-label="List view">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
        </div>

        <div id="bikes-grid" class="bikes-grid" aria-live="polite" aria-busy="true"></div>

        <div style="text-align:center;">
          <button type="button" id="bikes-load-more" class="btn btn--secondary" hidden>Load more</button>
          <p id="bikes-end" class="text-muted" style="font-size:var(--text-sm); margin-top:var(--space-3);" hidden>End of list — try a different filter.</p>
        </div>
      </div>
    </div>

    <!-- RENT MODAL -->
    <div class="modal-backdrop" id="rent-modal" role="dialog" aria-modal="true" aria-labelledby="rent-modal-title" aria-hidden="true">
      <div class="modal">
        <div class="modal__header">
          <div style="display:flex; gap:var(--space-3); align-items:center;">
            <img id="rent-bike-image" alt="" width="56" height="56" loading="lazy" style="width:56px; height:56px; object-fit:cover; border-radius:var(--radius-md); display:none;">
            <div>
              <h2 class="modal__title" id="rent-modal-title">Book a bike</h2>
              <p class="text-muted" style="font-size:var(--text-xs); margin-top:2px;">
                <span id="rent-bike-name">Bike</span>
              </p>
            </div>
          </div>
          <button type="button" class="icon-btn" data-modal-close aria-label="Close">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="modal__body">
          <form id="rent-form" class="form" novalidate>
            <div id="rent-alert" aria-live="polite"></div>

            <div class="form__row">
              <div class="form__group">
                <label class="form__label form__label--required" for="rent-start">Start date</label>
                <input type="date" id="rent-start" class="form__input" required>
              </div>
              <div class="form__group">
                <label class="form__label form__label--required" for="rent-end">End date</label>
                <input type="date" id="rent-end" class="form__input" required>
              </div>
            </div>

            <div class="form__group">
              <label class="form__checkbox">
                <input type="checkbox" id="rent-insurance">
                <span>Add damage protection (₹99 per booking)</span>
              </label>
              <span class="form__hint">Covers accidental damage and roadside support during your rental period.</span>
            </div>

            <div class="rent-summary" aria-live="polite">
              <div class="rent-summary__row"><span>Daily rate</span><span id="rent-daily">—</span></div>
              <div class="rent-summary__row"><span>Number of days</span><span><span id="rent-days">0</span> days</span></div>
              <div class="rent-summary__row"><span>Insurance</span><span id="rent-insurance-cost">₹0</span></div>
              <div class="rent-summary__row rent-summary__row--total"><span>Total</span><span class="rent-summary__value" id="rent-total">₹0</span></div>
            </div>
          </form>
        </div>

        <div class="modal__footer">
          <button type="button" class="btn btn--secondary" data-modal-close>Cancel</button>
          <button type="button" id="rent-confirm-btn" class="btn btn--primary">Confirm Booking</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
