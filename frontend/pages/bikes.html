<!--
  bikes.html — Page Fragment for Module 2.0: Bike Rent / Buy
  Injected into #page-content by router.js
  BikesModule.init() is called after injection
-->

<!-- Page header -->
<div class="page-header" style="margin-bottom:var(--space-5);">
  <div class="page-header__text">
    <h1 class="page-title">Bikes</h1>
    <p class="page-subtitle">Browse, rent or buy bikes near you.</p>
  </div>

  <!-- Search bar -->
  <div class="page-actions">
    <div class="input-group" style="min-width:220px;">
      <span class="input-icon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      <input type="search"
             id="bike-search"
             class="form-control"
             placeholder="Search bikes…"
             aria-label="Search bikes"
             style="padding-left:var(--space-10); border-radius:var(--radius-full);" />
    </div>
  </div>
</div>

<!-- Tab strip -->
<div class="tabs" role="tablist" id="bikes-tabs" aria-label="Bikes navigation">
  <button class="tab active"
          role="tab" aria-selected="true"
          data-tab="browse" id="tab-browse"
          aria-controls="bikes-browse-panel">Browse</button>
  <button class="tab"
          role="tab" aria-selected="false"
          data-tab="rentals" id="tab-rentals"
          aria-controls="bikes-rentals-panel">My Rentals</button>
</div>


<!-- ══════════════════════════════════════
     Browse Panel
══════════════════════════════════════ -->
<div id="bikes-browse-panel"
     role="tabpanel"
     aria-labelledby="tab-browse">

  <!-- Filters + view toggle row -->
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--space-3); margin-bottom:var(--space-5);">

    <!-- Type filter chips -->
    <div class="filter-bar" id="bike-filter-bar"
         role="group" aria-label="Filter bikes by type">
      <button class="filter-chip active" data-filter="all"      type="button">All</button>
      <button class="filter-chip"        data-filter="mountain" type="button">Mountain</button>
      <button class="filter-chip"        data-filter="road"     type="button">Road</button>
      <button class="filter-chip"        data-filter="electric" type="button">Electric</button>
      <button class="filter-chip"        data-filter="hybrid"   type="button">Hybrid</button>
      <button class="filter-chip"        data-filter="cruiser"  type="button">Cruiser</button>
    </div>

    <!-- Sort + view toggle -->
    <div style="display:flex; align-items:center; gap:var(--space-2); flex-shrink:0;">
      <label class="sr-only" for="bike-sort">Sort by</label>
      <select id="bike-sort" class="form-control form-control-sm" aria-label="Sort bikes">
        <option value="default">Sort: Default</option>
        <option value="price_asc">Price: Low → High</option>
        <option value="price_desc">Price: High → Low</option>
        <option value="name_asc">Name A–Z</option>
        <option value="available">Available first</option>
      </select>

      <!-- Grid / List toggle -->
      <div role="group" aria-label="View mode" style="display:flex; gap:var(--space-1);">
        <button id="view-grid-btn"
                class="btn btn-icon btn-sm btn-primary"
                type="button"
                aria-pressed="true"
                aria-label="Grid view" title="Grid view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
        </button>
        <button id="view-list-btn"
                class="btn btn-icon btn-sm btn-ghost"
                type="button"
                aria-pressed="false"
                aria-label="List view" title="List view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Results meta row -->
  <div id="bikes-results-meta"
       style="font-size:var(--text-xs); color:var(--color-text-muted); margin-bottom:var(--space-4);"
       aria-live="polite" aria-atomic="true">
    Loading bikes…
  </div>

  <!-- Bike grid — BikesModule renders cards here -->
  <div id="bikes-grid"
       class="bike-grid"
       aria-live="polite"
       aria-label="Bike listings"
       aria-relevant="additions removals">

    <!-- Static skeleton placeholders -->
    <div class="card" style="padding:0; overflow:hidden;" aria-hidden="true">
      <div class="skeleton skeleton-image"></div>
      <div style="padding:var(--space-5);">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text" style="width:60%;"></div>
      </div>
    </div>
    <div class="card" style="padding:0; overflow:hidden;" aria-hidden="true">
      <div class="skeleton skeleton-image"></div>
      <div style="padding:var(--space-5);">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text" style="width:50%;"></div>
      </div>
    </div>
    <div class="card" style="padding:0; overflow:hidden;" aria-hidden="true">
      <div class="skeleton skeleton-image"></div>
      <div style="padding:var(--space-5);">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text" style="width:70%;"></div>
      </div>
    </div>
    <div class="card" style="padding:0; overflow:hidden;" aria-hidden="true">
      <div class="skeleton skeleton-image"></div>
      <div style="padding:var(--space-5);">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text" style="width:55%;"></div>
      </div>
    </div>
    <div class="card" style="padding:0; overflow:hidden;" aria-hidden="true">
      <div class="skeleton skeleton-image"></div>
      <div style="padding:var(--space-5);">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text" style="width:65%;"></div>
      </div>
    </div>
    <div class="card" style="padding:0; overflow:hidden;" aria-hidden="true">
      <div class="skeleton skeleton-image"></div>
      <div style="padding:var(--space-5);">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text" style="width:45%;"></div>
      </div>
    </div>
  </div>
  <!-- /bikes-grid -->

  <!-- Pagination -->
  <nav class="pagination"
       id="bikes-pagination"
       style="margin-top:var(--space-8); justify-content:center;"
       aria-label="Bike listing pages">
    <!-- Populated by BikesModule -->
  </nav>

</div>
<!-- /bikes-browse-panel -->


<!-- ══════════════════════════════════════
     My Rentals Panel
══════════════════════════════════════ -->
<div id="bikes-rentals-panel"
     role="tabpanel"
     aria-labelledby="tab-rentals"
     style="display:none;">

  <!-- Quick stats strip -->
  <div id="rental-stats-strip"
       style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:var(--space-4); margin-bottom:var(--space-6);">
    <div class="card kpi-card">
      <div class="kpi-card__label">Total Rentals</div>
      <div class="kpi-card__value" id="stat-total-rentals">—</div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-card__label">Active Now</div>
      <div class="kpi-card__value" id="stat-active-rentals">—</div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-card__label">Total Spent</div>
      <div class="kpi-card__value" id="stat-total-spent">—</div>
    </div>
  </div>

  <!-- Rental list — BikesModule renders rows here -->
  <div id="rentals-list" aria-live="polite" aria-label="My rental bookings">
    <!-- skeleton -->
    <div class="card" style="margin-bottom:var(--space-3); padding:var(--space-4) var(--space-5);" aria-hidden="true">
      <div class="skeleton skeleton-heading" style="width:50%;"></div>
      <div class="skeleton skeleton-text"    style="width:30%; margin-top:var(--space-2);"></div>
    </div>
    <div class="card" style="margin-bottom:var(--space-3); padding:var(--space-4) var(--space-5);" aria-hidden="true">
      <div class="skeleton skeleton-heading" style="width:45%;"></div>
      <div class="skeleton skeleton-text"    style="width:25%; margin-top:var(--space-2);"></div>
    </div>
    <div class="card" style="margin-bottom:var(--space-3); padding:var(--space-4) var(--space-5);" aria-hidden="true">
      <div class="skeleton skeleton-heading" style="width:55%;"></div>
      <div class="skeleton skeleton-text"    style="width:35%; margin-top:var(--space-2);"></div>
    </div>
  </div>
</div>
<!-- /bikes-rentals-panel -->


<!-- ══════════════════════════════════════
     Bike Detail Modal
══════════════════════════════════════ -->
<div class="modal-backdrop"
     id="bike-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="bike-modal-title">
  <div class="modal" style="max-width:640px;">

    <div class="modal-header">
      <h2 class="modal-title" id="bike-modal-title">Bike Details</h2>
      <button class="modal-close btn btn-ghost btn-icon"
              id="bike-modal-close"
              aria-label="Close bike details" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6"  x2="6"  y2="18"/>
          <line x1="6"  y1="6"  x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Populated by BikesModule.openBikeDetail() -->
    <div class="modal-body" id="bike-modal-body"></div>

    <div class="modal-footer" id="bike-modal-footer">
      <button class="btn btn-ghost" id="bike-modal-close-2" type="button">Close</button>
    </div>

  </div>
</div>
<!-- /bike-modal -->


<!-- ══════════════════════════════════════
     Booking Modal
══════════════════════════════════════ -->
<div class="modal-backdrop"
     id="booking-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="booking-modal-title">
  <div class="modal" style="max-width:500px;">

    <div class="modal-header">
      <h2 class="modal-title" id="booking-modal-title">Book Bike</h2>
      <button class="modal-close btn btn-ghost btn-icon"
              id="booking-modal-close"
              aria-label="Close booking form" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6"  x2="6"  y2="18"/>
          <line x1="6"  y1="6"  x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Booking form injected by BikesModule.openBookingModal() -->
    <div class="modal-body" id="booking-modal-body"></div>

    <div class="modal-footer" id="booking-modal-footer">
      <button class="btn btn-ghost" id="booking-modal-close-2" type="button">Cancel</button>
      <button class="btn btn-primary" id="confirm-booking-btn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        Confirm Booking
      </button>
    </div>

  </div>
</div>
<!-- /booking-modal -->
