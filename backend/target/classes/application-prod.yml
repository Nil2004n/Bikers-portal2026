spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt-secret: ${JWT_SECRET}
  ai-service-url: ${AI_SERVICE_URL}

logging:
  level:
    com.bikersportal: INFO
    org.springframework.security: WARN
