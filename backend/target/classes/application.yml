server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bikers_portal
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt-secret: "bikers-portal-super-secret-key-change-in-prod-min-256-bits"
  jwt-expiration-ms: 86400000
  ai-service-url: http://localhost:11434
  ai-model: llama3

external:
  payment-gateway-url: https://mock-payment.example.com
  insurance-url: https://mock-insurance.example.com
  ads-url: https://mock-ads.example.com

logging:
  level:
    com.bikersportal: DEBUG
    org.springframework.security: INFO
