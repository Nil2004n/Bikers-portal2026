server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:./data/bikers_portal.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      maximum-pool-size: 1
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt-secret: ${JWT_SECRET:bikers-portal-super-secret-key-change-in-prod-min-256-bits}
  jwt-expiration-ms: 86400000
  ai-service-url: ${AI_SERVICE_URL:http://localhost:11434}
  ai-model: llama3
  supabase-url: ${SUPABASE_URL:http://localhost:54321}
  supabase-service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:local-dev-key}
  supabase-storage-bucket: ${SUPABASE_STORAGE_BUCKET:bikers-portal}

external:
  payment-gateway-url: https://mock-payment.example.com
  insurance-url: https://mock-insurance.example.com
  ads-url: https://mock-ads.example.com

logging:
  level:
    com.bikersportal: DEBUG
    org.springframework.security: INFO
